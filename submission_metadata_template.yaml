ai_usage_summary: |
  Used AI to help structure the code, parse requirements, and implement the offline/online split architecture. 
  No hosted LLM API was used during the timed ranking phase.

methodology_summary: |
  We split the process into an offline processing phase and an online ranking phase.
  In the offline phase, we use sentence-transformers/all-MiniLM-L6-v2 to embed career history and summaries, extract signals (demonstrated fit, evaluation frameworks), apply hard disqualifiers, and flag honeypots. All data is cached.
  In the online phase, we load the cached features, apply an arithmetic scoring formula with predefined weights, and generate a factual reasoning string based on the extracted features. This guarantees execution in under 5 minutes on CPU.

